# Der Katalogserver.
#
# Ausgeliefert wird GENAU DREIERLEI und sonst nichts:
#
#   /index.php                 der Katalog
#   /<slug>/<slug>.zip         die Pakete
#   /<slug>/README.md          die Beschreibungen
#
# Als Erlaubnisliste und nicht als Sperrliste. Im selben Verzeichnis
# liegt der Quelltext jedes Plugins (<slug>/src/), dazu bin/ und .git.
# Nichts davon ist geheim - es steckt genauso in den Paketen -, es
# gehoert hier nur nicht hin. Eine Sperrliste haette ich frueher oder
# spaeter unvollstaendig gelassen.

server {
    listen 80;
    server_name _;

    root /var/www/html;

    # Nur diese EINE PHP-Datei laeuft. Ein "location ~ \.php$" wuerde
    # jede Datei unter <slug>/src/ ausfuehrbar machen - und das ist
    # fremder Code, der hier nur zum Ausliefern liegt.
    location = /index.php {
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Der Katalog ist die Startseite.
    location = / {
        rewrite ^ /index.php last;
    }

    # Die Pakete. try_files entscheidet - was es nicht gibt, gibt es
    # nicht; der Ausdruck haelt nur alles fern, was kein Paket ist.
    location ~ "^/[a-z0-9][a-z0-9-]{1,38}[a-z0-9]/[a-z0-9][a-z0-9-]*\.zip$" {
        types { }
        default_type application/zip;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Die Beschreibungen. Als Text und nicht als Download: der
    # Controller holt sie mit "Accept: text/markdown" und rendert sie
    # selbst - HTML von hier wuerde er ohnehin nicht uebernehmen.
    location ~ "^/[a-z0-9][a-z0-9-]{1,38}[a-z0-9]/README\.md$" {
        types { }
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
